<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics club form</title>
    <style>
           body {
            background-image: url("https://i.pinimg.com/736x/20/85/01/2085014c7c85ff101f63235f59fcb344.jpg");
            background-color: rgb(250, 250, 248);
            background-repeat: no-repeat;
            background-size: cover;
        
        }
        .main {
            padding: 20px;
            background-color: rgb(255, 255, 255);
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        footer {
            text-align: center;
            color:white
        }

        </style>
</body>
<img id="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhGWMliic2yX4A8KaM5AP99wxYDDubpMTUsDhyHWKdYmoUUNZZYomypEc&s=10" alt="My Profile Picture" class="center-img" style="width: 150px; height: 160px; border-radius: 50%; object-fit: cover; border: 3px solid rgb(255, 255, 255); box-shadow: 0px 0px 10px rgba(0, 0, 0, 1);">



        

    

    
        
    


 
       
    </style>
</head>
<body>
    <div class="main">
        <h1 style="text-align: center;"><strong>OBMC Robotics Club Application Form</strong></h1>
        <p style="text-align: center;">Fill out the form below to join the Robotics Club.</p>
        <form>
            <fieldset>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter full name here">
                <br><br>
                                <label for="email">Email:</label>
                <input type="text" id="email" name="email" placeholder="Email">
                <br><br>
                <label for="Grade and section">Grade and Section:</label>
                <input type="grade and section" id="grade and section" name="grade and section" placeholder="Enter Grade and section">


                <br><br>
                <label for="gender" >Gender:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <br><br>
                <label for="skills">What are your skills?:</label>
                <input type="checkbox" id="Coding" name="skills" value="coding">
                <label for="coding">Coding</label>
                <input type="checkbox" id="electronics" name="skills" value="electronics">
                <label for="electronics">Electronics</label>
                <input type="checkbox" id="desing" name="skills" value="design">
                <label for="design">Design</label>
                <br><br>
                <label for="Tell us why do you want to join" >Tell us why do you want to join?:</label>
                <textarea id="why" name="why" placeholder="Enter reason here"></textarea>
                <br><br>
                <input type="submit" value="Submit Form">
               
               
            </fieldset>
        </form>
        </div>
    <footer>
        <p> 2026 Tiffany Villanueva. All rights reserved.</p>
    </footer>
</body>
</html>
